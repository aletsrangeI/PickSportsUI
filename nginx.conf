server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Permitir subida de imágenes y archivos de hasta 25MB
    client_max_body_size 25M;

    # Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # 1. Archivos dinámicos de entrada y ciclo de vida (NUNCA cachear)
    location ~* ^/(index\.html|sw\.js|version\.json|manifest\.json|manifest\.webmanifest)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires -1;
    }

    # 2. Bundles inmutables de Vite con hash en el nombre
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy a la API (.NET) - ^~ garantiza que no sea interceptado por regex
    location ^~ /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache para otros archivos estáticos con extensión (imágenes, fuentes)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Fallback para SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Healthcheck para el propio contenedor Nginx
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }
}
