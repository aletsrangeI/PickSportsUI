server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Permitir subida de imágenes y archivos de hasta 25MB
    client_max_body_size 25M;

    # Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Fallback para SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy a la API (.NET) - ^~ garantiza que no sea interceptado por la regex de archivos estáticos
    location ^~ /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache para archivos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Healthcheck para el propio contenedor Nginx
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }
}
