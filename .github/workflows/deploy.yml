name: CI/CD - PickSportsUI (Docker)

on:
  push:
    branches:
      - Development
      - main
  workflow_dispatch:

concurrency:
  group: deploy-picksports-ui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build Docker Image & Deploy to Homelab
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Obtener nombre de usuario en minúsculas
        run: |
          echo "IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar imagen Docker en GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/picksports-ui:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/picksports-ui:${{ github.sha }}

      # Conectar a Tailscale
      - name: Conectar a Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --accept-routes --hostname=gha-deploy-picksports-ui

      # Esperar a que el túnel Tailscale hacia Homelab esté caliente y listo
      - name: Verificar conectividad Tailscale hacia Homelab
        run: |
          echo "Verificando ruta Tailscale hacia ${{ secrets.HOMELAB_HOST }}..."
          for i in $(seq 1 12); do
            if tailscale ping -c 1 ${{ secrets.HOMELAB_HOST }} >/dev/null 2>&1; then
              echo ">> Túnel Tailscale activo y listo."
              break
            fi
            echo "Esperando ruta WireGuard (intento $i/12)..."
            sleep 2
          done

      # Configurar clave SSH sanitizando posibles saltos de línea y forzando algoritmo KEX compatible con MTU de Tailscale
      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat << 'EOF' > ~/.ssh/config
          Host *
            KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group14-sha256
            IPQoS throughput
            ServerAliveInterval 15
            ServerAliveCountMax 3
            StrictHostKeyChecking no
            ConnectTimeout 30
          EOF
          chmod 600 ~/.ssh/config
          ssh-keyscan -H ${{ secrets.HOMELAB_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      # Despliegue con Docker Compose en Homelab
      - name: Desplegar en Homelab con Docker Compose
        run: |
          SSH_USER=$(echo "${{ secrets.SSH_USER }}" | tr -d '\r\n[:space:]')
          HOMELAB_HOST=$(echo "${{ secrets.HOMELAB_HOST }}" | tr -d '\r\n[:space:]')
          
          cat << 'DEPLOY_SCRIPT_EOF' > deploy_remote.sh
          set -e
          cd /opt/picksports
          docker compose pull ui
          
          echo ">> === DIAGNÓSTICO PREVIO DE PUERTO 8089 ==="
          ss -tulpn | grep 8089 || echo ">> (ss) Ningún socket estándar detectado en 8089"
          docker ps --format 'table {{.ID}}\t{{.Names}}\t{{.Ports}}\t{{.Status}}'

          echo ">> Liberando puerto 8089 y removiendo contenedor ui previo..."
          docker compose stop ui 2>/dev/null || true
          docker rm -f picksports-ui 2>/dev/null || true
          
          # 1. Si cualquier otro contenedor Docker tiene mapeado el puerto 8089
          CONTAINER_8089=$(docker ps -q --filter "publish=8089")
          if [ -n "$CONTAINER_8089" ]; then
            echo ">> Deteniendo contenedor que ocupa 8089: $CONTAINER_8089"
            docker stop $CONTAINER_8089 2>/dev/null || true
            docker rm -f $CONTAINER_8089 2>/dev/null || true
          fi

          # 2. Si un docker-proxy huérfano retiene el puerto 8089
          pkill -9 -f "docker-proxy.*8089" 2>/dev/null || sudo pkill -9 -f "docker-proxy.*8089" 2>/dev/null || true

          # 3. Si un proceso host o fuser está disponible
          if command -v fuser >/dev/null 2>&1; then
            fuser -k -9 8089/tcp 2>/dev/null || sudo fuser -k -9 8089/tcp 2>/dev/null || true
          fi

          sleep 2
          echo ">> Estado del puerto 8089 tras limpieza:"
          ss -tulpn | grep 8089 || echo ">> Puerto 8089 libre."

          docker compose up -d --no-deps --remove-orphans ui
          docker ps --filter "name=picksports"
          echo ">> Verificando respuesta HTTP de picksports-ui en 8089 (/healthz)..."
          UI_HTTP_OK=0
          for j in $(seq 1 10); do
            if curl -sf -m 5 http://localhost:8089/healthz >/dev/null 2>&1 || wget -q -T 5 -O /dev/null http://localhost:8089/healthz 2>/dev/null; then
              UI_HTTP_OK=1
              break
            fi
            echo "Esperando respuesta de nginx (intento $j/10)..."
            sleep 3
          done
          if [ "$UI_HTTP_OK" -eq 1 ]; then
            echo ">> picksports-ui responde correctamente en 8089."
          else
            echo ">> ERROR: picksports-ui no respondió en 8089 tras 30s. Logs del contenedor:"
            docker logs --tail 30 picksports-ui || true
            exit 1
          fi
          echo ">> Contenedor picksports-ui desplegado exitosamente."
          DEPLOY_SCRIPT_EOF
          
          # Preflight: confirmar que la ruta TCP real hacia sshd (puerto 22) funciona.
          # tailscale ping puede dar OK por DERP mientras la ruta directa está degradada
          # (causa conocida de KEX SSH truncado: "expecting SSH2_MSG_KEX_ECDH_REPLY" + timeout).
          echo ">> Preflight: verificando ruta TCP hacia $HOMELAB_HOST:22..."
          for i in $(seq 1 10); do
            if timeout 8 bash -c "exec 3<>/dev/tcp/$HOMELAB_HOST/22" 2>/dev/null; then
              echo ">> Ruta TCP hacia puerto 22 confirmada."
              break
            fi
            echo ">> Puerto 22 aún no usable (intento $i/10). Re-estableciendo ruta Tailscale..."
            timeout 15 tailscale ping -c 2 "$HOMELAB_HOST" >/dev/null 2>&1 || true
            sleep 4
          done

          MAX_RETRIES=6
          COUNT=0
          DEPLOY_OK=0
          SSH_EXIT=0
          while [ "$COUNT" -lt "$MAX_RETRIES" ]; do
            set +e
            ssh -v -o KexAlgorithms=curve25519-sha256 -o IPQoS=throughput -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ConnectionAttempts=2 -i ~/.ssh/id_ed25519 "$SSH_USER@$HOMELAB_HOST" "bash -s" < deploy_remote.sh
            SSH_EXIT=$?
            set -e
            if [ "$SSH_EXIT" -eq 0 ]; then
              DEPLOY_OK=1
              break
            fi
            COUNT=$((COUNT+1))
            if [ "$SSH_EXIT" -ne 255 ]; then
              echo ">> El script remoto falló con código $SSH_EXIT (fallo de despliegue, no de conexión). No se reintenta."
              break
            fi
            if [ "$COUNT" -lt "$MAX_RETRIES" ]; then
              echo ">> Falló conexión SSH (código 255, p.ej. KEX truncado sobre WireGuard). Re-estableciendo ruta y reintentando en 15s (intento $((COUNT+1))/$MAX_RETRIES)..."
              timeout 15 tailscale ping -c 2 "$HOMELAB_HOST" >/dev/null 2>&1 || true
              sleep 15
            fi
          done
          if [ "$DEPLOY_OK" -ne 1 ]; then
            echo ">> Error crítico: el despliegue en Homelab no pudo completarse (último código SSH: $SSH_EXIT)."
            exit 1
          fi
